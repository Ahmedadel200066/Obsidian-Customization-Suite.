name: Build and publish plugin release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build root plugin bundle
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Validate tag, compatibility map, and release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/validate-release.cjs "$RELEASE_TAG"

      - name: Confirm generated assets match committed source
        run: git diff --exit-code -- main.js styles.css

      - name: Attest standard release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create draft release and attach standard assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-is-draft"; then
            if [ "$(cat "$RUNNER_TEMP/release-is-draft")" != "true" ]; then
              echo "This release is already published. Refusing to replace its assets."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Customization Studio $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" main.js manifest.json styles.css --clobber
          # Do not publish unexpected legacy extras if retrying a draft.
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/release-assets.json"
          node -e 'const fs = require("node:fs"); const names = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).assets.map(a => a.name).sort(); if (JSON.stringify(names) !== JSON.stringify(["main.js", "manifest.json", "styles.css"])) throw new Error("Expected exactly three standard release assets");' "$RUNNER_TEMP/release-assets.json"
          gh release edit "$RELEASE_TAG" --draft=false --latest
