name: Build and publish plugin release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build root plugin bundle
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Validate tag, compatibility map, and release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/validate-release.cjs "$RELEASE_TAG"

      - name: Confirm generated assets match committed source
        run: git diff --exit-code -- main.js styles.css

      - name: Create and verify installable ZIP
        run: |
          zip -q "$RUNNER_TEMP/Customization-Studio.zip" main.js manifest.json styles.css LICENSE
          python3 - "$RUNNER_TEMP/Customization-Studio.zip" <<'PY'
          import sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as archive:
              expected = {"main.js", "manifest.json", "styles.css", "LICENSE"}
              if set(archive.namelist()) != expected:
                  raise SystemExit("ZIP does not contain exactly the standard runtime files and license")
              if archive.testzip() is not None:
                  raise SystemExit("ZIP integrity check failed")
          print("Runtime ZIP verified.")
          PY

      - name: Create draft release and attach standard assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-is-draft"; then
            if [ "$(cat "$RUNNER_TEMP/release-is-draft")" != "true" ]; then
              echo "This release is already published. Refusing to replace its assets."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Customization Studio $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" main.js manifest.json styles.css LICENSE "$RUNNER_TEMP/Customization-Studio.zip" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
